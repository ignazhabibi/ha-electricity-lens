[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-electricity-lens"
version = "0.32.0"
description = "Home Assistant integration: electricity costs, mix, savings of PV, heat pump, and electric car, and when they pay off."
license = "MIT"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
dev = [
    "home-assistant-frontend==20261028.2",
    "pre-commit==4.7.0",
    "pyright==1.1.414",
    "pytest-cov==7.1.0",
    "pytest-homeassistant-custom-component==0.13.375",
    "ruff==0.17.3",
]

# The integration ships through HACS, not as a Python package.
[tool.setuptools]
packages = []

[tool.pyright]
include = ["custom_components", "tests", "scripts"]
exclude = [".venv", "build", "dist", "card"]
pythonVersion = "3.14"
extraPaths = []
typeCheckingMode = "standard"
strict = [
    "scripts",
    "custom_components/electricity_lens",
]
# Home Assistant declares cached properties in base classes, while integrations
# may validly override them with properties. Strict mode cannot lower a rule's
# severity, so the strict platform files carry targeted
# `# pyright: ignore[reportIncompatibleVariableOverride]` comments instead.
reportIncompatibleVariableOverride = "none"

[tool.coverage.run]
source = ["custom_components.electricity_lens"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "D",   # pydocstyle
    "E",   # pycodestyle error
    "W",   # pycodestyle warning
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "G",   # flake8-logging-format
    "N",   # pep8-naming
    "PT",  # flake8-pytest-style
    "SIM", # flake8-simplify
    "PL",  # pylint
    "RUF", # ruff specific
    "S"    # flake8-bandit (security)
]

ignore = [
    "D100", # Missing docstring in public module
    "D104", # Missing docstring in public package
    "D105", # Missing docstring in magic method
    "D203", # 1 blank line required before class docstring
    "D213", # Multi-line docstring summary should start at the second line
    "PLR0912", # Calculations follow the setup's cases
    "PLR0913", # Calculations take their figures as keyword arguments
    "PLR2004", # Magic value used
    "RUF001", # × and – are intended in user-facing text
    "S101", # Asserts narrow types, as in Home Assistant core
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "D", "PLR2004", "E501",
    # Tests assert and use placeholder credentials.
    "S101", "S105", "S106",
]
# The quality gate runs fixed tool commands. Translations are long texts.
"scripts/*" = ["S603", "S607", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
combine-as-imports = true
