<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Electricity Lens card demo</title>
<style>
  /* Home Assistant's default theme variables, light and dark, approximated. */
  :root {
    --primary-text-color: #212121; --secondary-text-color: #727272;
    --divider-color: rgba(0,0,0,.12); --primary-color: #03a9f4;
    --card-background-color: #fff; --primary-background-color: #fafafa;
    --ha-card-border-color: #e0e0e0;
  }
  :root[data-theme="dark"] {
    --primary-text-color: #e1e1e1; --secondary-text-color: #9b9b9b;
    --divider-color: rgba(225,225,225,.12); --primary-color: #03a9f4;
    --card-background-color: #1c1c1c; --primary-background-color: #111111;
    --ha-card-border-color: rgba(225,225,225,.12);
  }
  body { margin: 0; background: var(--primary-background-color); color: var(--primary-text-color);
         font: 14px/20px Roboto, system-ui, sans-serif; }
  main { max-width: 1000px; margin: 0 auto; padding: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(360px, 100%), 1fr)); gap: 16px; }
  h1 { font-size: 20px; font-weight: 500; }
  .label { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--secondary-text-color); margin: 0 0 6px; }
</style>
<script>
  // A stand-in for Home Assistant's ha-card.
  customElements.define("ha-card", class extends HTMLElement {
    constructor() {
      super();
      this.attachShadow({ mode: "open" }).innerHTML = `<style>:host{display:block;background:var(--card-background-color);
        border:1px solid var(--ha-card-border-color);border-radius:12px;color:var(--primary-text-color)}</style><slot></slot>`;
    }
  });
  const params = new URLSearchParams(location.search);
  if (params.get("theme")) document.documentElement.dataset.theme = params.get("theme");
</script>
<script type="module" src="../../custom_components/electricity_lens/frontend/electricity-lens.js"></script>
</head>
<body>
<main>
  <h1>Electricity Lens card</h1>
  <div class="grid" id="grid"></div>
</main>
<script type="module">
  const language = new URLSearchParams(location.search).get("lang") ?? "de";
  const day = 24 * 3600 * 1000;
  const now = Date.now();

  function hass(categories, extra = {}) {
    const states = {}, entities = {};
    for (const c of categories) {
      const device = `device_${c.category}`;
      const id = (key) => `sensor.${c.category}_${key}`;
      entities[id("saving")] = { entity_id: id("saving"), device_id: device, platform: "electricity_lens", translation_key: "saving" };
      entities[id("payback")] = { entity_id: id("payback"), device_id: device, platform: "electricity_lens", translation_key: "payback" };
      entities[id("per_year")] = { entity_id: id("per_year"), device_id: device, platform: "electricity_lens", translation_key: "saving_per_year" };
      states[id("saving")] = { entity_id: id("saving"), state: c.calculating ? "unknown" : String(c.saving), attributes: {
        category: c.category, statistic_id: `electricity_lens:${c.category}_saving`, calculating: !!c.calculating, investment: c.investment ?? null,
        counting_since: c.since ? new Date(c.since).toISOString() : null,
        yearly_from: c.since ? new Date(new Date(c.since).getTime() + 365.25 * day).toISOString() : null,
        price: c.price ?? null, heating: c.heating ?? null, heat_estimated: c.estimated ?? false } };
      const payback = c.investment && (c.complete ?? true) && !c.calculating ? (c.saving / c.investment) * 100 : null;
      states[id("payback")] = { entity_id: id("payback"), state: payback === null ? "unknown" : String(payback), attributes: {} };
      states[id("per_year")] = { entity_id: id("per_year"), state: c.perYear == null ? "unknown" : String(c.perYear), attributes: {} };
    }
    return { states, entities, locale: { language }, config: { currency: "EUR" }, connection: {}, callWS: (m) => ws(m, extra.calculating), ...extra };
  }

  // October 2026 of the real test household, for the key figure card.
  const october = {
    "electricity_lens:household_energy": 2027.8, "electricity_lens:household_solar": 509.1,
    "electricity_lens:household_cost": 437.2, "electricity_lens:household_cheap": 592.0,
    "electricity_lens:household_solar_cost": 35.6, "electricity_lens:household_cheap_cost": 107.7,
    "sensor.grid_import": 1518.7, "sensor.grid_export": 233.9, "electricity_lens:grid_cost": 398.5,
    "electricity_lens:grid_import_cost": 400.4, "electricity_lens:grid_feed_in": 16.4, "electricity_lens:grid_cheap_saving": 83.1,
    "sensor.solar": 743.0, "electricity_lens:pv_saving": 178.2,
    "sensor.waschkuche": 105.2, "electricity_lens:device_sensor_waschkuche_solar": 26.4,
    "electricity_lens:device_sensor_waschkuche_cost": 22.3, "electricity_lens:device_sensor_waschkuche_cheap": 31.0,
    "electricity_lens:device_sensor_waschkuche_solar_cost": 1.8, "electricity_lens:device_sensor_waschkuche_cheap_cost": 5.6,
    "sensor.goe": 485.6, "electricity_lens:device_sensor_goe_solar": 135.8,
    "electricity_lens:device_sensor_goe_cost": 77.5, "electricity_lens:device_sensor_goe_cheap": 260.1,
    "electricity_lens:device_sensor_goe_solar_cost": 9.5, "electricity_lens:device_sensor_goe_cheap_cost": 47.3,
    "sensor.wp_heizung": 222.7, "sensor.wp_dhw": 120.0, "electricity_lens:heat_pump_saving": 82.4,
    "electricity_lens:heat_pump_heat": 1636.5, "electricity_lens:heat_pump_alternative_cost": 213.5, "electricity_lens:hp_cost": 77.5, "electricity_lens:hp_solar": 41.2,
    "electricity_lens:hp_solar_cost": 2.9, "electricity_lens:hp_cheap": 82.0, "electricity_lens:hp_cheap_cost": 14.9,
    "electricity_lens:wallbox_saving": 159.2, "electricity_lens:wallbox_distance": 2428.0, "electricity_lens:wallbox_alternative_cost": 378.8,
  };
  const levels = (area) => ({ solar: [`electricity_lens:${area}_solar`], cost: [`electricity_lens:${area}_cost`], cheap: [`electricity_lens:${area}_cheap`],
    solar_cost: [`electricity_lens:${area}_solar_cost`], cheap_cost: [`electricity_lens:${area}_cheap_cost`] });
  const figuresInfo = (calculating) => ({
    calculating: !!calculating,
    levels: { cheap_until: 0.22, expensive_from: null },
    areas: [
      { id: "household", kind: "household", name: "Haushalt", statistics: { energy: ["electricity_lens:household_energy"], ...levels("household") } },
      { id: "grid", kind: "grid", name: "Netz", statistics: { energy: ["sensor.grid_import"], export: ["sensor.grid_export"], cost: ["electricity_lens:grid_cost"],
        import_cost: ["electricity_lens:grid_import_cost"], feed_in: ["electricity_lens:grid_feed_in"], cheap_saving: ["electricity_lens:grid_cheap_saving"] } },
      { id: "solar", kind: "solar", name: "Solar", forecast: true, statistics: { energy: ["sensor.solar"], self_used: ["electricity_lens:household_solar"], saving: ["electricity_lens:pv_saving"] } },
      { id: "heat_pump", kind: "category", name: "Wärmepumpe", statistics: { energy: ["sensor.wp_heizung", "sensor.wp_dhw"], saving: ["electricity_lens:heat_pump_saving"],
        heat: ["electricity_lens:heat_pump_heat"], alternative_cost: ["electricity_lens:heat_pump_alternative_cost"], cost: ["electricity_lens:hp_cost"], solar: ["electricity_lens:hp_solar"],
        solar_cost: ["electricity_lens:hp_solar_cost"], cheap: ["electricity_lens:hp_cheap"], cheap_cost: ["electricity_lens:hp_cheap_cost"] } },
      { id: "wallbox", kind: "category", name: "E-Auto", statistics: { energy: ["sensor.goe"], saving: ["electricity_lens:wallbox_saving"],
        distance: ["electricity_lens:wallbox_distance"], alternative_cost: ["electricity_lens:wallbox_alternative_cost"], cost: ["electricity_lens:device_sensor_goe_cost"], solar: ["electricity_lens:device_sensor_goe_solar"],
        solar_cost: ["electricity_lens:device_sensor_goe_solar_cost"], cheap: ["electricity_lens:device_sensor_goe_cheap"], cheap_cost: ["electricity_lens:device_sensor_goe_cheap_cost"] } },
      { id: "device_sensor_waschkuche", kind: "device", name: "Wäsche", statistics: { energy: ["sensor.waschkuche"], ...levels("device_sensor_waschkuche") } },
      { id: "device_sensor_goe", kind: "device", name: "E-Auto", statistics: { energy: ["sensor.goe"], ...levels("device_sensor_goe") } },
    ],
  });
  async function ws(message, calculating) {
    if (message.type === "electricity_lens/figures") return figuresInfo(calculating);
    if (message.type === "energy/solar_forecast") {
      const today = new Date(); today.setHours(12, 0, 0, 0);
      return { forecast: { wh_hours: { [today.toISOString()]: 12400 } } };
    }
    if (message.type === "recorder/get_statistics_metadata") {
      return message.statistic_ids.map((id) => ({ statistic_id: id,
        name: id === "sensor.aussentemperatur" ? "Außentemperatur" : "Wäsche",
        statistics_unit_of_measurement: id === "sensor.aussentemperatur" ? "°C" : "kWh",
        unit_class: id === "sensor.aussentemperatur" ? "temperature" : "energy" }));
    }
    if (message.types?.includes("mean") || message.units) {
      const result = {};
      for (const id of message.statistic_ids) {
        result[id] = id === "sensor.aussentemperatur"
          ? [{ start: Date.parse(message.start_time), mean: 11.9, min: 7.1, max: 18.9 }]
          : october[id] === undefined ? [] : [{ start: Date.parse(message.start_time), change: october[id] }];
      }
      return result;
    }
    return statistics(message);
  }

  // Monthly savings for recorder/statistics_during_period, by category.
  const monthly = { pv: [40, 60, 110, 150, 190, 210, 200, 170, 120, 70, 40, 30],
                    heat_pump: [70, 55, 35, 10, -5, -8, -6, -5, 5, 30, 55, 75], wallbox: [60, 60, 60, 60, 60, 60, 60, 60, 60, 60, 60, 60] };
  async function statistics(message) {
    const result = {};
    for (const id of message.statistic_ids) {
      const category = id.replace(/^electricity_lens:/, "").replace(/_saving$/, "");
      const rows = [];
      const from = new Date(message.start_time), to = new Date(message.end_time);
      for (let d = new Date(from.getFullYear(), from.getMonth(), 1); d < to && d.getTime() < now; d.setMonth(d.getMonth() + 1))
        rows.push({ start: d.getTime(), change: monthly[category][d.getMonth()] });
      result[id] = rows;
    }
    return result;
  }

  const household = [
    { category: "pv", saving: 6240, investment: 14500, perYear: 1719, since: "2023-03-14" },
    { category: "heat_pump", saving: 1410, investment: 9000, perYear: 653, since: "2024-09-01", price: 0.11, heating: "gas", estimated: true },
    { category: "wallbox", saving: 2130, perYear: 724, since: "2023-11-01", price: 1.75 },
  ];
  const cases = [
    ["a · Direkt nach der Einrichtung", hass(household.map((c) => ({ ...c, calculating: true }))), "total"],
    ["b · Gesamt", hass(household), "total"],
    ["c · Pro Jahr", hass(household), "yearly"],
    ["d · Ölheizung, ohne Mehrkosten", hass([{ ...household[1], heating: "oil", price: 1.05, investment: null, estimated: false }]), "total"],
    ["e · Erst wenige Monate Daten, pro Jahr", hass([
      { category: "pv", saving: 410, investment: 14500, perYear: null, since: new Date(now - 120 * day).toISOString() },
      { category: "heat_pump", saving: 95, investment: 9000, perYear: null, since: new Date(now - 120 * day).toISOString(), price: 0.11 },
    ]), "yearly"],
    ["f · Amortisiert", hass([{ category: "pv", saving: 16100, investment: 14500, perYear: 1800, since: "2017-03-14" }]), "yearly"],
    ["g · Nicht eingerichtet", hass([]), "total"],
  ];
  const grid = document.getElementById("grid");
  const figureCases = [
    ["j · Kennzahl: Kosten", hass(household), { period: "last_month", area: "household", figure: "cost" }],
    ["k · Kennzahl: Statistik, Summe", hass(household), { period: "last_month", statistic: "sensor.waschkuche", value: "change" }],
    ["l · Kennzahl: Statistik, Mittel mit Spanne", hass(household), { period: "last_month", statistic: "sensor.aussentemperatur", value: "mean", secondary: "range" }],
    ["q · Kennzahl: Entität", { ...hass(household), states: { ...hass(household).states,
      "sensor.strompreis_helfer": { entity_id: "sensor.strompreis_helfer", state: "31.8", attributes: { friendly_name: "Strompreis", unit_of_measurement: "ct/kWh" } } } },
      { entity: "sensor.strompreis_helfer", name: "Strompreis jetzt" }],
    ["r · Kennzahl: Solaranteil", hass(household), { period: "last_month", area: "household", figure: "solar_share" }],
    ["s · Kennzahl: JAZ", hass(household), { period: "last_month", area: "heat_pump", figure: "scop" }],
    ["t · Kosten: Stromrechnung", hass(household), { period: "last_month", area: "grid", figure: "cost", name: "Stromrechnung" }],
    ["u · Kosten: ø Netzpreis", hass(household), { period: "last_month", area: "grid", figure: "grid_price" }],
    ["v · Kosten: ø Preis inkl. Solar", hass(household), { period: "last_month", area: "household", figure: "price", name: "ø Preis inkl. Solar" }],
    ["w · Kosten: Ersparnis durch günstige Zeiten", hass(household), { period: "last_month", area: "grid", figure: "cheap_saving" }],
    ["x · Laden: Ersparnis mit PV", hass(household), { period: "last_month", area: "wallbox", figure: "saving" }],
    ["y · Kennzahl: Prognose", hass(household), { period: "last_month", area: "solar", figure: "forecast_today" }],
    ["z2 · Kennzahl: ohne Zeile", hass(household), { period: "last_month", area: "heat_pump", figure: "heat_price", secondary: "none" }],
    ["z · Alte Konfiguration mit einer Kachel", hass(household), { title: "Haushalt", period: "last_month", tiles: [{ area: "household", figure: "cost" }] }],
    ["m · Kennzahl: wird berechnet", hass(household, { calculating: true }), { period: "this_month", area: "household", figure: "cost" }],
    ["m2 · Kennzahl: Bereich fehlt", hass(household), { period: "this_month", area: "device_sensor_weg", figure: "cost", name: "Trockner" }],
  ];
  const info = figuresInfo();
  info.areas.push({ id: "other", kind: "other", name: "Sonstiges", statistics: { energy: ["electricity_lens:other_energy"], ...levels("other") } });
  Object.assign(october, { "electricity_lens:other_energy": 1095.0, "electricity_lens:other_solar": 279.5, "electricity_lens:other_cost": 254.0, "electricity_lens:other_cheap": 219.0,
    "electricity_lens:other_solar_cost": 19.6, "electricity_lens:other_cheap_cost": 39.9,
    "sensor.heat_heating": 1187.7, "sensor.heat_dhw": 448.8 });
  const breakdownCases = [
    ["n · Aufteilung: Strommix", { area: "household", by: "source", display: "ring", period: "last_month" }],
    ["o · Aufteilung: Kostenverteilung", { title: "Kostenverteilung", area: "household", by: "consumer", figure: "cost", display: "bars", color_by_source: true, period: "last_month" }],
    ["p · Aufteilung: Statistiken", { title: "Wärme nach Zweck", statistics: [{ statistic: "sensor.heat_heating", name: "Heizung" }, { statistic: "sensor.heat_dhw", name: "Warmwasser" }], period: "last_month" }],
  ];
  for (const [label, config] of breakdownCases) {
    const wrap = document.createElement("section");
    wrap.innerHTML = `<p class="label">${label}</p>`;
    const card = document.createElement("electricity-lens-breakdown-card");
    card.setConfig({ type: "custom:electricity-lens-breakdown-card", ...config });
    card.hass = { ...hass(household), callWS: (m) => m.type === "electricity_lens/figures" ? Promise.resolve(info) : ws(m) };
    wrap.append(card);
    grid.append(wrap);
  }
  for (const [label, mock, config] of figureCases) {
    const wrap = document.createElement("section");
    wrap.innerHTML = `<p class="label">${label}</p>`;
    const card = document.createElement("electricity-lens-figures-card");
    card.setConfig({ type: "custom:electricity-lens-figures-card", ...config });
    card.hass = mock;
    wrap.append(card);
    grid.append(wrap);
  }
  for (const [label, mock] of [["h · Verlauf ohne Datumsauswahl", hass(household)], ["i · Verlauf, nicht eingerichtet", hass([])]]) {
    const wrap = document.createElement("section");
    wrap.innerHTML = `<p class="label">${label}</p>`;
    const card = document.createElement("electricity-lens-history-card");
    card.setConfig({});
    card.hass = mock;
    wrap.append(card);
    grid.append(wrap);
  }
  for (const [label, mock, view] of cases) {
    const wrap = document.createElement("section");
    wrap.innerHTML = `<p class="label">${label}</p>`;
    const card = document.createElement("electricity-lens-balance-card");
    card.setConfig({});
    card._view = view;
    card.hass = mock;
    wrap.append(card);
    grid.append(wrap);
  }
</script>
</body>
</html>
