name: Pre-release Pipeline

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "22"

on:
  push:
    tags:
      - "v*-alpha.*"
      - "v*-beta.*"
      - "v*-rc.*"

permissions:
  contents: read

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: "pip"
    - uses: actions/setup-node@v5
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: "npm"
        cache-dependency-path: card/package-lock.json
    - name: Install
      run: |
        python -m pip install --upgrade pip
        python -m pip install '.[dev]'
        npm --prefix card ci
    - name: Quality check
      run: python scripts/quality_check.py

  pre-release:
    needs: quality-check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - name: Read Release Notes
      id: release_notes
      env:
        TAG: ${{ github.ref_name }}
      # The release PR adds release-notes/<tag>.md, so a tag created on the
      # GitHub release page works. An annotated tag's message is the fallback;
      # a lightweight tag has no message of its own, so the job fails rather
      # than publish the commit message as release notes.
      run: |
        NOTES_FILE="release-notes/${TAG}.md"
        if [ -f "$NOTES_FILE" ]; then
          NOTES=$(cat "$NOTES_FILE")
        else
          git fetch --depth=1 origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          if [ "$(git cat-file -t "$TAG")" != "tag" ]; then
            echo "::error::Missing $NOTES_FILE, and $TAG is not an annotated tag"
            exit 1
          fi
          NOTES=$(git tag -l --format='%(contents:body)' "$TAG")
        fi
        DELIMITER="RELEASE_NOTES_$(date +%s%N)"
        {
          echo "body<<${DELIMITER}"
          echo "$NOTES"
          echo "${DELIMITER}"
        } >> "$GITHUB_OUTPUT"
    - name: GitHub Pre-release
      uses: softprops/action-gh-release@v3
      with:
        body: ${{ steps.release_notes.outputs.body }}
        generate_release_notes: false
        prerelease: true
