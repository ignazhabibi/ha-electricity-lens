name: CI/CD Pipeline

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "22"

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  quality-check:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v') || !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    # uv installs Home Assistant and its test stack faster than pip, and caches it.
    - uses: astral-sh/setup-uv@v10.3.3
    - uses: actions/setup-node@v5
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: card/package-lock.json
    - name: Install
      run: |
        uv pip install --system '.[dev]'
        npm --prefix card ci
    - name: Quality check
      run: python scripts/quality_check.py

  release:
    needs: quality-check
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - name: Check that the manifest version matches the tag
      env:
        TAG: ${{ github.ref_name }}
      run: test "v$(jq -r .version custom_components/electricity_lens/manifest.json)" = "$TAG"
    - name: Read Release Notes
      id: release_notes
      env:
        TAG: ${{ github.ref_name }}
      # The release PR adds release-notes/<tag>.md, so a tag created on the
      # GitHub release page works. An annotated tag's message is the fallback;
      # a lightweight tag has no message of its own, so the job fails rather
      # than publish the commit message as release notes.
      run: |
        NOTES_FILE="release-notes/${TAG}.md"
        if [ -f "$NOTES_FILE" ]; then
          NOTES=$(cat "$NOTES_FILE")
        else
          git fetch --depth=1 origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          if [ "$(git cat-file -t "$TAG")" != "tag" ]; then
            echo "::error::Missing $NOTES_FILE, and $TAG is not an annotated tag"
            exit 1
          fi
          NOTES=$(git tag -l --format='%(contents:body)' "$TAG")
        fi
        DELIMITER="RELEASE_NOTES_$(date +%s%N)"
        {
          echo "body<<${DELIMITER}"
          echo "$NOTES"
          echo "${DELIMITER}"
        } >> "$GITHUB_OUTPUT"
    - name: GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        body: ${{ steps.release_notes.outputs.body }}
        generate_release_notes: false
